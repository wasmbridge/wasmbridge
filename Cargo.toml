[package]
name = "wasmbridge"
version = "0.0.1"
authors = [
	"WasmBridge Team",
]
license = "MIT"
edition = "2024"
repository = "https://github.com/wasmbrigde/wasmbridge"
[workspace]
members = [
	"libs/wintray",
	"libs/wintray/macros",
	"crates/plugin-protocol",
]
exclude = [
	"libs/wasmbrigde-plugin-template",
]
[workspace.dependencies]
serde = { version = "1.0.228", features = [
	"derive",
] }
serde_json = "1.0.149"
[dependencies]
plugin-protocol = { path = "crates/plugin-protocol" }
wintray = { git = "https://github.com/wasmbridge/wintray" }
wasmbridge-client-proto = { git = "https://github.com/wasmbridge/bridge-protocol" }
tokio = { version = "1.52.1", features = [
	"rt-multi-thread",
	"net",
	"sync",
	"macros",
	"time",
] }
serde = { workspace = true }
serde_json = { workspace = true }
extism = "1.21.0"
anyhow = "1.0"
toml = "0.8"
notify = "6.1"
reqwest = { version = "0.12", features = [
	"blocking",
	"rustls-tls",
] }
sysinfo = "0.33"
sha2 = "0.10"
hex = "0.4"
rustls = { version = "0.23", features = [
	"ring",
] }
chrono = "0.4"
[patch."https://github.com/wasmbridge/wintray.git"]
wintray = { path = "libs/wintray" }
[patch."https://github.com/wasmbridge/bridge-protocol.git"]
wasmbridge-client-proto = { path = "../bridge-protocol/crates/wasmbridge-client-proto" }
[profile.dev]
opt-level = 0
debug = true
[profile.dev.package."*"]
opt-level = 3
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
[profile.dist]
inherits = "release"
lto = "thin"
[[bin]]
name = "wasmbridge"
path = "src/main.rs"