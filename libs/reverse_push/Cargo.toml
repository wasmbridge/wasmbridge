[package]
name = "reverse_push"
version = "0.1.0"
edition = "2024"
[dependencies]
tonic = { version = "0.12.3", features = [
	"tls",
] }
prost = "0.13.1"
tokio = { version = "1.52.1", features = [
	"macros",
	"rt-multi-thread",
	"sync",
	"time",
] }
tokio-stream = "0.1.18"
rustls = { version = "0.23", features = [
	"ring",
] }
[build-dependencies]
tonic-build = "0.12.3"
protoc-bin-vendored = "3.0"
[[bin]]
name = "mock_server"
path = "src/bin/mock_server.rs"
